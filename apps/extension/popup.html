<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vibe Launcher</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      font-family: -apple-system, system-ui, sans-serif;
      background: #fff;
      color: #111;
    }
    .header {
      padding: 16px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }
    .logo span {
      background: linear-gradient(135deg, #f97316, #ea580c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #d1d5db;
    }
    .status-dot.connected { background: #22c55e; }
    .body { padding: 16px; space-y: 12px; }
    .platform-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: #f9fafb;
      border: 1px solid #f0f0f0;
      border-radius: 8px;
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 12px;
    }
    .launch-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .launch-btn:hover { opacity: 0.9; }
    .launch-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .divider {
      border: none;
      border-top: 1px solid #f0f0f0;
      margin: 12px 0;
    }
    .open-app {
      display: block;
      text-align: center;
      font-size: 12px;
      color: #9ca3af;
      text-decoration: none;
      padding: 4px;
    }
    .open-app:hover { color: #374151; }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">vibe<span>launcher</span></span>
    <div class="status-dot" id="statusDot"></div>
  </div>
  <div class="body">
    <div class="platform-badge" id="platformBadge">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </svg>
      <span id="platformName">Detecting platform...</span>
    </div>
    <button class="launch-btn" id="launchBtn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13"/>
      </svg>
      Launch on X
    </button>
    <hr class="divider" />
    <a href="http://localhost:3000" target="_blank" class="open-app">Open Vibe Launcher →</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
